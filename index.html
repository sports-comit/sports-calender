<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School Sports Events in Bahrain</title>
    <style>
        /* --- BILINGUAL NUMBER OVERRIDE (FORCE ENGLISH NUMERALS) --- */
        html[dir="rtl"] *, html[dir="ltr"] * { 
            font-variant-numeric: lining-nums tabular-nums !important; 
            font-feature-settings: "lnum" 1, "tnum" 1 !important; 
            /* Enforcing standard system fonts that respect numeric overrides */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }

        :root {
            /* Exclusive Blue Palette */
            --dark-blue: #0A192F;
            --main-blue: #0077B6;
            --baby-blue: #90E0EF;
            --pale-blue: #CAF0F8;
            --bg-color: #F4FBFF;
            --white: #FFFFFF;
            
            /* Logo Buffer Space */
            --logo-buffer: 2rem;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--dark-blue);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header & Branding --- */
        header {
            background-color: var(--dark-blue);
            padding: 1.5rem var(--logo-buffer);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.4);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: var(--logo-buffer); /* Spatial exclusion buffer zone */
        }

        .logo-wrapper {
            background-color: var(--white);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }

        .logo-wrapper img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        h1 {
            color: var(--baby-blue);
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
            /* Sophisticated clean glow effect */
            text-shadow: 0 0 12px rgba(144, 224, 239, 0.7), 0 0 25px rgba(0, 119, 182, 0.6);
            letter-spacing: 0.5px;
        }

        #langToggle {
            background-color: var(--baby-blue);
            color: var(--dark-blue);
            border: 2px solid transparent;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #langToggle:hover {
            background-color: var(--dark-blue);
            color: var(--baby-blue);
            border-color: var(--baby-blue);
            box-shadow: 0 0 10px var(--baby-blue);
        }

        /* --- Main Layout --- */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid var(--pale-blue);
            padding-bottom: 0.5rem;
        }

        .section-title {
            color: var(--dark-blue);
            font-size: 1.6rem;
        }

        /* --- Upcoming Showcase --- */
        #upcoming-showcase {
            margin-bottom: 4rem;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .event-card {
            background: var(--white);
            border: 1px solid var(--pale-blue);
            border-radius: 12px;
            padding: 1.5rem;
            border-inline-start: 6px solid var(--main-blue);
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.08);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 119, 182, 0.15);
        }

        .card-date {
            font-size: 0.95rem;
            color: var(--main-blue);
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: inline-block;
            background-color: var(--pale-blue);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }

        .card-title {
            font-size: 1.2rem;
            color: var(--dark-blue);
            font-weight: 700;
        }

        /* --- 12-Month Calendar Grid --- */
        #year-grid-section {
            transition: opacity 0.3s ease;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .month-block {
            background-color: var(--pale-blue);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .month-block:hover {
            background-color: var(--main-blue);
            color: var(--white);
            border-color: var(--dark-blue);
            transform: scale(1.03);
        }

        .month-block:hover .month-count {
            background-color: var(--white);
            color: var(--main-blue);
        }

        .month-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .month-count {
            font-size: 0.95rem;
            background-color: var(--dark-blue);
            color: var(--baby-blue);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            display: inline-block;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        /* --- Expanded Month View --- */
        #expanded-month-section {
            display: none;
            animation: slideIn 0.4s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .expanded-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--white);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--pale-blue);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-btn {
            background-color: var(--dark-blue);
            color: var(--white);
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .back-btn:hover { background-color: var(--main-blue); }

        .filters-container {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--pale-blue);
            color: var(--dark-blue);
            border: 1px solid var(--main-blue);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-btn.active {
            background-color: var(--main-blue);
            color: var(--white);
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            background-color: var(--pale-blue);
            border: 2px solid var(--main-blue);
            border-radius: 12px;
            overflow: hidden;
            padding: 6px;
        }

        .day-header {
            background-color: var(--dark-blue);
            color: var(--baby-blue);
            text-align: center;
            padding: 1rem 0;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 6px;
        }

        .day-cell {
            background-color: var(--white);
            min-height: 120px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-radius: 6px;
        }

        .day-cell.empty { background-color: transparent; border: 1px dashed rgba(0, 119, 182, 0.3); }
        .day-cell.today { border: 2px solid var(--main-blue); background-color: var(--bg-color); }

        .day-number {
            font-weight: 800;
            color: var(--dark-blue);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .event-chip {
            background-color: var(--main-blue);
            color: var(--white);
            padding: 0.4rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
            transition: background 0.2s;
        }

        .event-chip:hover { background-color: var(--dark-blue); }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            /* Transparent blue color backdrop utilizing smooth backdrop-filter blur */
            background-color: rgba(0, 34, 68, 0.5); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--white);
            padding: 2.5rem;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 34, 68, 0.3);
            border: 3px solid var(--baby-blue);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-title {
            color: var(--dark-blue);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--pale-blue);
            padding-bottom: 0.8rem;
        }

        .modal-detail {
            margin-bottom: 1rem;
            color: var(--main-blue);
            font-size: 1.05rem;
            display: flex;
            gap: 0.5rem;
        }

        .modal-detail strong { color: var(--dark-blue); min-width: 90px; }

        .modal-close {
            margin-top: 2rem;
            width: 100%;
            background-color: var(--main-blue);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-close:hover { background-color: var(--dark-blue); }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; text-align: center; }
            .brand-container { flex-direction: column; gap: 1rem; }
            h1 { font-size: 1.4rem; }
            .expanded-controls { flex-direction: column; align-items: stretch; }
            .day-cell { min-height: 80px; padding: 0.25rem; }
            .event-chip { font-size: 0.7rem; padding: 0.2rem; }
            .day-header { font-size: 0.8rem; padding: 0.5rem 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="logo-wrapper">
                <!-- Embedded Live Wikimedia Commons SVG for the State Emblem of Bahrain -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Emblem_of_Bahrain.svg/512px-Emblem_of_Bahrain.svg.png" alt="MOE Logo" id="moeLogo">
            </div>
            <h1 id="pageTitle">School Sports Events in Bahrain</h1>
        </div>
        <button id="langToggle">عربي</button>
    </header>

    <main>
        <!-- Upcoming Events Showcase (Landing State) -->
        <section id="upcoming-showcase">
            <div class="section-header">
                <h2 class="section-title" id="upcomingTitle">Upcoming Events Showcase</h2>
            </div>
            <div class="showcase-grid" id="upcomingCards">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- 12-Month Calendar Grid -->
        <section id="year-grid-section">
            <div class="section-header">
                <h2 class="section-title" id="yearTitle">2026 - 2027 Academic Calendar</h2>
            </div>
            <div class="year-grid" id="yearGrid">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Expanded Month View -->
        <section id="expanded-month-section">
            <div class="section-header">
                <h2 class="section-title" id="expandedMonthTitle">Month Year</h2>
            </div>
            <div class="expanded-controls">
                <button class="back-btn" id="backBtn">Back to Year View</button>
                <div class="filters-container" id="categoryFilters">
                    <!-- Filters injected via JS -->
                </div>
            </div>
            <div class="calendar" id="calendarGrid">
                <!-- Injected via JS -->
            </div>
        </section>
    </main>

    <!-- Event Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-content">
            <h3 class="modal-title" id="mTitle">Event Title</h3>
            <div class="modal-detail"><strong id="lDate">Date:</strong> <span id="mDate"></span></div>
            <div class="modal-detail"><strong id="lTime">Time:</strong> <span id="mTime"></span></div>
            <div class="modal-detail"><strong id="lLoc">Location:</strong> <span id="mLoc"></span></div>
            <button class="modal-close" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        // <!-- GM&USER_EDITABLE_DATA_START -->
        // STRICT NUMBER RULE APPLIED: All dates, times, and identifiers use standard digits (0-9).
        const eventsData = [
            { id: 1, title_en: 'Sports Governance', title_ar: 'الحوكمة الرياضية', date: '2026-10-04', time: '09:00', location_en: 'Ministry Headquarters', location_ar: 'مقر الوزارة', sport_category: 'Management' },
            { id: 2, title_en: 'Sports Selection', title_ar: 'الانتقاء الرياضي', date: '2026-10-11', time: '08:00', location_en: 'National Stadium', location_ar: 'الاستاد الوطني', sport_category: 'Talent' },
            { id: 3, title_en: 'Start of Discovering Talents', title_ar: 'البدء باكتشاف المواهب الطلابية', date: '2026-10-15', time: '10:00', location_en: 'Various Schools', location_ar: 'مدارس مختلفة', sport_category: 'Talent' },
            { id: 4, title_en: 'Educational Regions Cup', title_ar: 'كأس منتخبات المناطق التعليمية', date: '2026-10-25', time: '15:30', location_en: 'Isa Town Club', location_ar: 'نادي مدينة عيسى', sport_category: 'Tournament' },
            { id: 5, title_en: 'University Partnership', title_ar: 'الشراكة الجامعية', date: '2026-11-01', time: '11:00', location_en: 'University of Bahrain', location_ar: 'جامعة البحرين', sport_category: 'University' },
            { id: 6, title_en: 'University Games (Esports)', title_ar: 'الألعاب الجامعية (الإلكترونية)', date: '2026-11-15', time: '18:00', location_en: 'Esports Arena', location_ar: 'صالة الألعاب الإلكترونية', sport_category: 'University' },
            { id: 7, title_en: 'Technical Conference', title_ar: 'المؤتمر الفني لدوري الجامعات', date: '2027-02-07', time: '09:30', location_en: 'Conference Hall', location_ar: 'قاعة المؤتمرات', sport_category: 'Management' },
            { id: 8, title_en: 'Elite Sports Camps', title_ar: 'معسكرات النخبة الرياضية', date: '2027-03-14', time: '07:00', location_en: 'Training Center', location_ar: 'مركز التدريب', sport_category: 'Talent' },
            { id: 9, title_en: 'University Games (Chess)', title_ar: 'الألعاب الجامعية (للشطرنج)', date: '2027-03-21', time: '16:00', location_en: 'Student Center', location_ar: 'مركز الطلبة', sport_category: 'University' },
            { id: 10, title_en: 'University Games (Table Tennis)', title_ar: 'الألعاب الجامعية (كرة الطاولة)', date: '2027-04-04', time: '15:00', location_en: 'Sports Hall', location_ar: 'الصالة الرياضية', sport_category: 'University' },
            { id: 11, title_en: 'University Games (Football)', title_ar: 'الألعاب الجامعية (كرة القدم)', date: '2027-04-11', time: '17:30', location_en: 'Main Field', location_ar: 'الملعب الرئيسي', sport_category: 'University' },
            { id: 12, title_en: 'Gulf School Tournament', title_ar: 'البطولة الخليجية المدرسية', date: '2027-04-25', time: '08:00', location_en: 'National Complex', location_ar: 'المجمع الوطني', sport_category: 'Tournament' },
            { id: 13, title_en: 'University Forums', title_ar: 'ملتقيات جامعية', date: '2027-05-09', time: '10:00', location_en: 'Auditorium', location_ar: 'المسرح', sport_category: 'University' },
            { id: 14, title_en: 'Sports Excellence Award', title_ar: 'جائزة التميز الرياضي', date: '2027-05-16', time: '19:00', location_en: 'Royal Hall', location_ar: 'القاعة الملكية', sport_category: 'Management' }
        ];
        // <!-- GM&USER_EDITABLE_DATA_END -->

        // State & Setup
        let currentLang = 'en';
        let expandedMonthData = null; // Stores currently viewed month
        let activeFilter = 'All';     // Filter for the expanded calendar view
        const todayStr = new Date().toISOString().split('T')[0]; // Current date for highlighting

        // Generate 12 Months starting from Sep 2026
        const academicYearMonths = Array.from({length: 12}, (_, i) => {
            const d = new Date(2026, 8 + i, 1);
            return { year: d.getFullYear(), month: d.getMonth() };
        });

        // Dictionary (STRICT NUMBER RULE: Only standard 0-9 digits in translations)
        const i18n = {
            en: {
                title: "School Sports Events in Bahrain",
                btnLang: "عربي",
                upcomingTitle: "Upcoming Events Showcase",
                yearTitle: "2026 - 2027 Academic Calendar",
                backBtn: "Back to Year View",
                lDate: "Date:",
                lTime: "Time:",
                lLoc: "Location:",
                btnClose: "Close",
                eventsCount: "Events",
                filterAll: "All Categories",
                days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
                months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
            },
            ar: {
                title: "فعاليات الرياضة المدرسية في البحرين",
                btnLang: "English",
                upcomingTitle: "أبرز الفعاليات القادمة",
                yearTitle: "التقويم الأكاديمي 2026 - 2027",
                backBtn: "العودة للتقويم السنوي",
                lDate: "التاريخ:",
                lTime: "الوقت:",
                lLoc: "المكان:",
                btnClose: "إغلاق",
                eventsCount: "فعاليات",
                filterAll: "جميع الفئات",
                days: ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"],
                months: ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"]
            }
        };

        // Initialize App
        function init() {
            setupEventListeners();
            updateLanguageUI();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'en' ? 'ltr' : 'rtl';
            updateLanguageUI();
        }

        function updateLanguageUI() {
            const t = i18n[currentLang];
            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('langToggle').textContent = t.btnLang;
            document.getElementById('upcomingTitle').textContent = t.upcomingTitle;
            document.getElementById('yearTitle').textContent = t.yearTitle;
            document.getElementById('backBtn').textContent = t.backBtn;
            document.getElementById('lDate').textContent = t.lDate;
            document.getElementById('lTime').textContent = t.lTime;
            document.getElementById('lLoc').textContent = t.lLoc;
            document.getElementById('closeModalBtn').textContent = t.btnClose;

            renderUpcoming();
            if (expandedMonthData) {
                renderFilters();
                renderExpandedMonth(expandedMonthData.year, expandedMonthData.month);
            } else {
                renderYearGrid();
            }
        }

        function renderUpcoming() {
            const container = document.getElementById('upcomingCards');
            container.innerHTML = '';
            
            // Filter future events and take top 4
            const upcoming = eventsData
                .filter(e => e.date >= todayStr)
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .slice(0, 4);

            upcoming.forEach(e => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.onclick = () => openModal(e);
                
                const title = currentLang === 'en' ? e.title_en : e.title_ar;
                card.innerHTML = `
                    <div class="card-date">${e.date}</div>
                    <div class="card-title">${title}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderYearGrid() {
            const container = document.getElementById('yearGrid');
            container.innerHTML = '';
            document.getElementById('year-grid-section').style.display = 'block';
            document.getElementById('expanded-month-section').style.display = 'none';
            expandedMonthData = null;

            const t = i18n[currentLang];

            academicYearMonths.forEach(m => {
                const block = document.createElement('div');
                block.className = 'month-block';
                
                const count = eventsData.filter(e => {
                    const ed = new Date(e.date);
                    return ed.getFullYear() === m.year && ed.getMonth() === m.month;
                }).length;

                block.innerHTML = `
                    <div class="month-name">${t.months[m.month]} ${m.year}</div>
                    <div class="month-count">${count} ${t.eventsCount}</div>
                `;
                
                block.onclick = () => {
                    document.getElementById('year-grid-section').style.display = 'none';
                    document.getElementById('expanded-month-section').style.display = 'block';
                    expandedMonthData = { year: m.year, month: m.month };
                    activeFilter = 'All';
                    renderFilters();
                    renderExpandedMonth(m.year, m.month);
                    document.getElementById('expanded-month-section').scrollIntoView({ behavior: 'smooth' });
                };
                container.appendChild(block);
            });
        }

        function renderFilters() {
            const container = document.getElementById('categoryFilters');
            container.innerHTML = '';
            const t = i18n[currentLang];
            
            const categories = ['All', ...new Set(eventsData.map(e => e.sport_category))];
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${activeFilter === cat ? 'active' : ''}`;
                btn.textContent = cat === 'All' ? t.filterAll : cat;
                btn.onclick = () => {
                    activeFilter = cat;
                    renderFilters(); // Re-render to update active class
                    renderExpandedMonth(expandedMonthData.year, expandedMonthData.month);
                };
                container.appendChild(btn);
            });
        }

        function renderExpandedMonth(year, month) {
            const t = i18n[currentLang];
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            document.getElementById('expandedMonthTitle').textContent = `${t.months[month]} ${year}`;

            // Header Days
            t.days.forEach(day => {
                const div = document.createElement('div');
                div.className = 'day-header';
                div.textContent = day;
                grid.appendChild(div);
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Offset empty cells
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                grid.appendChild(emptyCell);
            }

            // Fill actual days
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                const dateString = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                if(dateString === todayStr) cell.classList.add('today');
                
                const num = document.createElement('div');
                num.className = 'day-number';
                num.textContent = day;
                cell.appendChild(num);

                const dayEvents = eventsData.filter(e => {
                    return e.date === dateString && (activeFilter === 'All' || e.sport_category === activeFilter);
                });

                dayEvents.forEach(e => {
                    const chip = document.createElement('div');
                    chip.className = 'event-chip';
                    chip.textContent = currentLang === 'en' ? e.title_en : e.title_ar;
                    chip.onclick = (event) => {
                        event.stopPropagation();
                        openModal(e);
                    };
                    cell.appendChild(chip);
                });

                grid.appendChild(cell);
            }
        }

        function openModal(eventData) {
            document.getElementById('mTitle').textContent = currentLang === 'en' ? eventData.title_en : eventData.title_ar;
            document.getElementById('mDate').textContent = eventData.date;
            document.getElementById('mTime').textContent = eventData.time;
            document.getElementById('mLoc').textContent = currentLang === 'en' ? eventData.location_en : eventData.location_ar;
            
            document.getElementById('eventModal').classList.add('active');
        }

        function setupEventListeners() {
            document.getElementById('langToggle').addEventListener('click', toggleLanguage);
            
            document.getElementById('backBtn').addEventListener('click', () => {
                renderYearGrid();
                document.getElementById('year-grid-section').scrollIntoView({ behavior: 'smooth' });
            });

            const modal = document.getElementById('eventModal');
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                modal.classList.remove('active');
            });
            
            modal.addEventListener('click', (e) => {
                if(e.target === modal) modal.classList.remove('active');
            });
        }

        // Run
        init();
    </script>
</body>
</html>
