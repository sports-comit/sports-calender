    <style>
        :root {
            --brand-blue: #134074; 
            --brand-blue-hover: #0b2545;
            --brand-blue-light: #eff6ff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #f1f5f9;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.02);
            --shadow-md: 0 4px 20px -2px rgba(15, 23, 42, 0.04);
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding: 0 4rem; /* Strict 4cm equivalent safe margins to prevent edge bleeding */
        }

        /* --- DASHBOARD WRAPPER & GRID --- */
        .dashboard-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 5rem;
        }

        /* --- HEADER AREA LAYOUT --- */
        header {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            margin-top: 2rem;
        }

        /* Isolated Top Right Logo Container (Nothing Next to It) */
        .moe-header-emblem {
            position: absolute;
            top: 0;
            right: 0;
            width: 110px;
            height: auto;
            z-index: 10;
        }

        .moe-header-emblem img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* Centered Page Title (3 cm spacing below logo alignment baseline) */
        .title-block {
            text-align: center;
            margin-top: 115px; /* Strict 3cm visual vertical offset below logo positioning */
            width: 100%;
        }

        .title-block h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        .title-block .subtitle {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* English/Arabic Toggle (3 cm under logo, shifted left) */
        .language-container {
            position: absolute;
            top: 115px; /* Aligned 3cm under logo element baseline */
            right: 40px; /* Offset to the left side of the right margin layout border */
            z-index: 20;
        }

        .toggle-lang-btn {
            background: var(--bg-card);
            color: var(--brand-blue);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .toggle-lang-btn:hover {
            border-color: var(--brand-blue);
            background-color: var(--brand-blue-light);
        }

        /* Mini Titles & Controls Navigation (2 cm spacing from Lang Button alignment) */
        .mini-navigation-tabs {
            margin-top: 75px; /* Strict 2cm visual separation below language alignment container */
            display: flex;
            justify-content: flex-start;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
            width: 100%;
        }

        .nav-button {
            background: transparent;
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .nav-button:hover {
            color: var(--text-dark);
            background-color: var(--border-color);
        }

        .nav-button.active {
            color: var(--brand-blue);
            background-color: var(--brand-blue-light);
            font-weight: 700;
        }

        /* --- SECTION CONTROLS (Academic Calendar Clean Label) --- */
        .section-headline {
            margin: 2.5rem 0 1.5rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-headline h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        /* --- DASHBOARD LAYOUT BLOCKS (Clean Grid Setup) --- */
        .main-dashboard-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            align-items: start;
            width: 100%;
        }

        /* Sidebar Sidepanel Layout */
        .dashboard-sidebar {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .action-button {
            width: 100%;
            background: var(--brand-blue);
            color: var(--white);
            border: none;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 12px rgba(19, 64, 116, 0.2);
            transition: all 0.2s ease;
            margin-bottom: 1.5rem;
        }

        .action-button:hover {
            background: var(--brand-blue-hover);
            transform: translateY(-1px);
        }

        /* --- CALENDAR MATRIX GRID (2cm Spacing between elements) --- */
        .calendar-matrix-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 75px; /* Strict uniform 2cm calendar cell frame gap spacing layout */
        }

        .month-container-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
        }

        .month-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .month-label-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .month-event-counter {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--brand-blue);
            background: var(--brand-blue-light);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
        }

        .days-header-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .days-grid-matrix {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            row-gap: 0.5rem;
        }

        .date-cell-item {
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.5rem 0;
            color: var(--text-dark);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .date-cell-item:hover:not(.empty-space) {
            background-color: var(--border-color);
        }

        .date-cell-item.active-event-day {
            background-color: var(--brand-blue);
            color: #ffffff !important;
            font-weight: 700;
        }

        .date-cell-item.empty-space {
            cursor: default;
