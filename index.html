
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahrain School Sports Events Year 2026-2027</title>
    <style>
        /* ==========================================================================
           1. STRICT NUMERIC RULE & GLOBAL RESET
           ========================================================================== */
        *, *::before, *::after, html[dir="rtl"] *, html[dir="ltr"] * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Strict Western/English numerals across both languages */
            font-variant-numeric: lining-nums tabular-nums !important;
            font-feature-settings: "lnum" 1, "tnum" 1 !important;
        }

        :root {
            /* Forest Green Palette */
            --forest-primary: #0B4A3A;
            --forest-dark: #072F25;
            --forest-light: #166450;
            --forest-glow: rgba(11, 74, 58, 0.45);
            
            /* Backgrounds & Neutrals */
            --bg-page: #F4F7F5;
            --surface-card: #FFFFFF;
            --border-subtle: #E2E8E5;
            --border-focus: #CBD5E1;
            --text-main: #192A24;
            --text-muted: #5A6E65;
            --text-light: #8E9F97;

            /* Category Pastels */
            --cat-blue-bg: #E3F2FD;
            --cat-blue-txt: #1565C0;
            --cat-blue-border: #BBDEFB;

            --cat-yellow-bg: #FFFDE7;
            --cat-yellow-txt: #F57F17;
            --cat-yellow-border: #FFF9C4;

            --cat-orange-bg: #FFF3E0;
            --cat-orange-txt: #E65100;
            --cat-orange-border: #FFE0B2;

            --cat-green-bg: #E8F5E9;
            --cat-green-txt: #2E7D32;
            --cat-green-border: #C8E6C9;

            --cat-purple-bg: #F3E5F5;
            --cat-purple-txt: #7B1FA2;
            --cat-purple-border: #E1BEE7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ==========================================================================
           2. HEADER & LOGO BRANDING
           ========================================================================== */
        header {
            background: linear-gradient(135deg, var(--forest-dark) 0%, var(--forest-primary) 100%);
            padding: 1.25rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(7, 47, 37, 0.15);
            border-bottom: 2px solid var(--forest-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .header-brand-wrap {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .header-logo-container {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 4px;
            backdrop-filter: blur(4px);
            flex-shrink: 0;
        }

        .header-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
        }

        .header-title-box h1 {
            color: #E2F1ED;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-shadow: 0 0 10px rgba(144, 224, 239, 0.3),
                         0 0 20px rgba(22, 100, 80, 0.6);
            transition: all 0.3s ease;
        }

        .header-subtitle {
            font-size: 0.8rem;
            color: #A3C9BE;
            font-weight: 500;
            margin-top: -2px;
        }

        .lang-btn {
            background-color: #E2F1ED;
            color: var(--forest-dark);
            border: 1.5px solid transparent;
            padding: 0.5rem 1.25rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .lang-btn:hover {
            background-color: #FFFFFF;
            border-color: #A3C9BE;
            box-shadow: 0 0 12px rgba(226, 241, 237, 0.4);
            transform: translateY(-1px);
        }

        /* ==========================================================================
           3. APP CONTAINER & CONTROLS
           ========================================================================== */
        main {
            flex: 1;
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem 1.5rem;
        }

        .control-panel {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .tabs-cluster {
            display: flex;
            gap: 0.5rem;
            background-color: var(--bg-page);
            padding: 0.3rem;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        .tab-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            padding: 0.5rem 1.1rem;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .tab-btn.active {
            background: var(--forest-primary);
            color: #FFFFFF;
            box-shadow: 0 2px 6px rgba(11, 74, 58, 0.25);
        }

        .tab-btn:hover:not(.active) {
            color: var(--forest-primary);
            background: rgba(11, 74, 58, 0.05);
        }

        .category-legend {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .legend-tag {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            border: 1px solid transparent;
        }

        .legend-tag.blue { background: var(--cat-blue-bg); color: var(--cat-blue-txt); border-color: var(--cat-blue-border); }
        .legend-tag.orange { background: var(--cat-orange-bg); color: var(--cat-orange-txt); border-color: var(--cat-orange-border); }
        .legend-tag.green { background: var(--cat-green-bg); color: var(--cat-green-txt); border-color: var(--cat-green-border); }
        .legend-tag.purple { background: var(--cat-purple-bg); color: var(--cat-purple-txt); border-color: var(--cat-purple-border); }

        /* ==========================================================================
           4. CALENDAR GRID VIEW
           ========================================================================== */
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }

        .year-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
        }

        .month-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .month-card:hover {
            border-color: var(--forest-light);
            box-shadow: 0 6px 16px rgba(11, 74, 58, 0.06);
        }

        .month-card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--forest-dark);
            margin-bottom: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0.4rem;
        }

        .month-card-title .year-badge {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .calendar-matrix {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            text-align: center;
        }

        .cal-head-cell {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 600;
            padding-bottom: 0.4rem;
        }

        .cal-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            border-radius: 6px;
            border: 1px solid transparent;
            color: var(--text-main);
            background: transparent;
            position: relative;
            cursor: default;
            user-select: none;
        }

        .cal-cell.is-empty {
            visibility: hidden;
        }

        .cal-cell.has-event {
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .cal-cell.has-event:hover {
            transform: scale(1.18);
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .cal-cell.cat-blue { background: var(--cat-blue-bg); color: var(--cat-blue-txt); border-color: var(--cat-blue-border); }
        .cal-cell.cat-orange { background: var(--cat-orange-bg); color: var(--cat-orange-txt); border-color: var(--cat-orange-border); }
        .cal-cell.cat-green { background: var(--cat-green-bg); color: var(--cat-green-txt); border-color: var(--cat-green-border); }
        .cal-cell.cat-purple { background: var(--cat-purple-bg); color: var(--cat-purple-txt); border-color: var(--cat-purple-border); }

        /* ==========================================================================
           5. UPCOMING CARDS & TIMELINE VIEWS
           ========================================================================== */
        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.25rem;
        }

        .event-card-item {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.35rem;
            border-inline-start: 5px solid var(--forest-primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .event-card-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(11, 74, 58, 0.08);
            border-color: var(--border-focus);
        }

        .event-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .event-card-date {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--forest-primary);
            background: #E8F2EE;
            padding: 0.2rem 0.6rem;
            border-radius: 5px;
        }

        .event-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--forest-dark);
            margin-bottom: 0.5rem;
            line-height: 1.35;
        }

        .event-card-location {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-top: 0.5rem;
        }

        /* Timeline List Layout */
        .timeline-container {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .timeline-row {
            display: grid;
            grid-template-columns: 140px 1fr 140px;
            gap: 1.5rem;
            align-items: center;
            padding: 1.1rem 0;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .timeline-row:last-child {
            border-bottom: none;
        }

        .timeline-row:hover {
            background-color: var(--bg-page);
            border-radius: 6px;
        }

        .timeline-date {
            font-weight: 700;
            color: var(--forest-primary);
            font-size: 0.9rem;
        }

        .timeline-main h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.2rem;
        }

        .timeline-main p {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .timeline-badge-wrap {
            text-align: end;
        }

        /* Past Scores Table */
        .table-wrap {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .scores-table {
            width: 100%;
            border-collapse: collapse;
            text-align: start;
        }

        .scores-table th {
            background-color: var(--forest-dark);
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 1rem 1.25rem;
            text-align: inherit;
        }

        .scores-table td {
            padding: 1rem 1.25rem;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border-subtle);
            text-align: inherit;
        }

        .scores-table tbody tr:hover {
            background-color: var(--bg-page);
        }

        .score-pill {
            background-color: #E2F1ED;
            color: var(--forest-dark);
            font-weight: 800;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            display: inline-block;
        }

        /* ==========================================================================
           6. FROSTED BLUE MODAL
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 42, 60, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.is-active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(187, 222, 251, 0.8);
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            padding: 2.25rem;
            box-shadow: 0 16px 40px rgba(0, 50, 80, 0.25);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.is-active .modal-box {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0.75rem;
        }

        .modal-title {
            color: var(--forest-dark);
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1.35;
        }

        .modal-field {
            margin-bottom: 0.9rem;
            display: flex;
            align-items: baseline;
            gap: 0.6rem;
            font-size: 0.95rem;
        }

        .modal-field strong {
            color: var(--forest-primary);
            min-width: 90px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .modal-field span {
            color: var(--text-main);
            font-weight: 500;
        }

        .modal-close-action {
            margin-top: 1.75rem;
            width: 100%;
            background-color: var(--forest-primary);
            color: #FFFFFF;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .modal-close-action:hover {
            background-color: var(--forest-dark);
        }

        /* ==========================================================================
           7. RESPONSIVENESS
           ========================================================================== */
        @media (max-width: 768px) {
            header {
                padding: 1rem 1.2rem;
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .header-brand-wrap {
                width: 100%;
                justify-content: space-between;
            }
            .lang-btn {
                align-self: flex-end;
                margin-top: -3.2rem;
            }
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .tabs-cluster {
                overflow-x: auto;
            }
            .timeline-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            .timeline-badge-wrap {
                text-align: start;
            }
        }
    </style>
</head>

        // Render 12 Month Cards containing Modern Mini-Calendar Grids
        function render12MonthCalendarGrid() {
            const container = document.getElementById("yearGridWrapper");
            container.innerHTML = "";
            const strings = i18n[currentLang];

            // Build dictionary of event days for quick lookup
            const eventMap = {};
            calendarEvents.forEach(evt => {
                eventMap[evt.date] = evt;
            });

            academicMonthsConfig.forEach((cfg, idx) => {
                const card = document.createElement("div");
                card.className = "month-card";

                const monthName = strings.months[idx];
                const headerHtml = `
                    <div class="month-card-title">
                        <span>${monthName}</span>
                    </div>
                `;

                let matrixHtml = `<div class="calendar-matrix">`;
                strings.days.forEach(d => {
                    matrixHtml += `<div class="cal-head-cell">${d}</div>`;
                });

                const firstDayIndex = new Date(cfg.year, cfg.month, 1).getDay();
                const totalDays = new Date(cfg.year, cfg.month + 1, 0).getDate();

                // Empty padding slots
                for (let i = 0; i < firstDayIndex; i++) {
                    matrixHtml += `<div class="cal-cell is-empty"></div>`;
                }

                // Days
                for (let day = 1; day <= totalDays; day++) {
                    const monthPadded = String(cfg.month + 1).padStart(2, '0');
                    const dayPadded = String(day).padStart(2, '0');
                    const dateKey = `${cfg.year}-${monthPadded}-${dayPadded}`;
                    
                    const eventData = eventMap[dateKey];
                    if (eventData) {
                        matrixHtml += `
                            <div class="cal-cell has-event cat-${eventData.category_theme}" 
                                 onclick="triggerEventModal(${eventData.id})"
                                 title="${currentLang === 'en' ? eventData.title_en : eventData.title_ar}">
                                ${formatNumberString(day)}
                            </div>
                        `;
                    } else {
                        matrixHtml += `<div class="cal-cell">${formatNumberString(day)}</div>`;
                    }
                }

                matrixHtml += `</div>`;
                card.innerHTML = headerHtml + matrixHtml;
                container.appendChild(card);
            });
        }

        // Render Upcoming View Cards
        function renderUpcomingCards() {
            const container = document.getElementById("upcomingCardsWrapper");
            container.innerHTML = "";
            
            // In October 2026, events after 2026-10-04 are designated upcoming
            const upcomingEvents = calendarEvents.filter(evt => evt.date >= "2026-10-04");

            upcomingEvents.forEach(evt => {
                const card = document.createElement("div");
                card.className = "event-card-item";
                card.onclick = () => triggerEventModal(evt.id);

                const title = currentLang === "en" ? evt.title_en : evt.title_ar;
                const location = currentLang === "en" ? evt.location_en : evt.location_ar;

                card.innerHTML = `
                    <div>
                        <div class="event-card-header">
                            <span class="event-card-date">${formatNumberString(evt.date)} • ${formatNumberString(evt.time)}</span>
                            <span class="legend-tag ${evt.category_theme}">${evt.category}</span>
                        </div>
                        <h3 class="event-card-title">${title}</h3>
                    </div>
                    <div class="event-card-location">
                        <span>📍</span>
                        <span>${location}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Render Timeline List View
        function renderTimelineList() {
            const container = document.getElementById("timelineWrapper");
            container.innerHTML = "";

            calendarEvents.forEach(evt => {
                const row = document.createElement("div");
                row.className = "timeline-row";
                row.onclick = () => triggerEventModal(evt.id);

                const title = currentLang === "en" ? evt.title_en : evt.title_ar;
                const location = currentLang === "en" ? evt.location_en : evt.location_ar;

                row.innerHTML = `
                    <div class="timeline-date">${formatNumberString(evt.date)}<br><small style="color:var(--text-light);">${formatNumberString(evt.time)}</small></div>
                    <div class="timeline-main">
                        <h4>${title}</h4>
                        <p>📍 ${location}</p>
                    </div>
                    <div class="timeline-badge-wrap">
                        <span class="legend-tag ${evt.category_theme}">${evt.category}</span>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Render Scores Table
        function renderPastScoresTable() {
            const container = document.getElementById("scoresBodyWrapper");
            container.innerHTML = "";

            calendarEvents.forEach(evt => {
                const tr = document.createElement("tr");
                const title = currentLang === "en" ? evt.title_en : evt.title_ar;
                const teams = currentLang === "en" ? evt.teams_en : evt.teams_ar;

                tr.innerHTML = `
                    <td><strong>${formatNumberString(evt.date)}</strong></td>
                    <td>${title}</td>
                    <td>${teams}</td>
                    <td><span class="score-pill">${formatNumberString(evt.score)}</span></td>
                `;
                container.appendChild(tr);
            });
        }

        // ==========================================================================
        // INTERACTIVE STATE HANDLING & MODALS
        // ==========================================================================
        function triggerEventModal(eventId) {
            const eventItem = calendarEvents.find(e => e.id === eventId);
            if (!eventItem) return;

            document.getElementById("modalTitle").textContent = currentLang === "en" ? eventItem.title_en : eventItem.title_ar;
            document.getElementById("modalDate").textContent = formatNumberString(eventItem.date);
            document.getElementById("modalTime").textContent = formatNumberString(eventItem.time);
            document.getElementById("modalLocation").textContent = currentLang === "en" ? eventItem.location_en : eventItem.location_ar;
            document.getElementById("modalTeams").textContent = currentLang === "en" ? eventItem.teams_en : eventItem.teams_ar;
            document.getElementById("modalCategory").textContent = eventItem.category;

            document.getElementById("eventModal").classList.add("is-active");
        }

        function setupNavigation() {
            const tabButtons = document.querySelectorAll(".tab-btn");
            tabButtons.forEach(btn => {
                btn.addEventListener("click", () => {
                    tabButtons.forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");

                    const targetViewId = btn.getAttribute("data-view");
                    document.querySelectorAll(".view-section").forEach(sec => sec.classList.remove("active"));

                    if (targetViewId === "yearGrid") document.getElementById("viewYearGrid").classList.add("active");
                    if (targetViewId === "upcoming") document.getElementById("viewUpcoming").classList.add("active");
                    if (targetViewId === "timeline") document.getElementById("viewTimeline").classList.add("active");
                    if (targetViewId === "pastScores") document.getElementById("viewPastScores").classList.add("active");
                });
            });
        }

        function setupModal() {
            const modal = document.getElementById("eventModal");
            const closeBtn = document.getElementById("modalCloseBtn");

            closeBtn.addEventListener("click", () => modal.classList.remove("is-active"));
            modal.addEventListener("click", (e) => {
                if (e.target === modal) modal.classList.remove("is-active");
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && modal.classList.contains("is-active")) {
                    modal.classList.remove("is-active");
                }
            });
        }

        function setupLangToggle() {
            const btn = document.getElementById("langToggle");
            btn.addEventListener("click", () => {
                currentLang = currentLang === "en" ? "ar" : "en";
                document.documentElement.lang = currentLang;
                document.documentElement.dir = currentLang === "en" ? "ltr" : "rtl";
                renderAllViews();
            });
        }

        // Initialize when DOM content is ready
        document.addEventListener("DOMContentLoaded", initApp);
