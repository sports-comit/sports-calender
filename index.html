<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School Sports Events in Bahrain</title>
    <style>
        :root {
            /* Exclusive Blue Palette */
            --dark-blue: #0A192F;
            --main-blue: #0077B6;
            --baby-blue: #90E0EF;
            --light-blue: #CAF0F8;
            --white: #FFFFFF;
            --bg-color: #F8FDFF;
            --text-main: #002244;
            
            /* Spacing & Buffers */
            --logo-buffer: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        /* --- Header & Branding --- */
        header {
            background-color: var(--dark-blue);
            color: var(--white);
            padding: 1.5rem var(--logo-buffer);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: var(--logo-buffer);
        }

        .logo-placeholder {
            /* Buffer zone enforced by margin/padding and container gap */
            background-color: var(--white);
            border-radius: 8px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-placeholder img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0;
            /* Sophisticated clean glow effect */
            text-shadow: 0 0 10px rgba(144, 224, 239, 0.6), 0 0 20px rgba(0, 119, 182, 0.4);
            color: var(--baby-blue);
        }

        #langToggle {
            background-color: var(--baby-blue);
            color: var(--dark-blue);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #langToggle:hover {
            background-color: var(--white);
            box-shadow: 0 0 10px var(--baby-blue);
        }

        /* --- Main Layout --- */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .section-title {
            color: var(--dark-blue);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid var(--baby-blue);
            padding-bottom: 0.5rem;
            display: inline-block;
        }

        /* --- Upcoming Showcase --- */
        #upcoming-showcase {
            margin-bottom: 3rem;
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .event-card {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            border-left: 5px solid var(--main-blue);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }

        html[dir="rtl"] .event-card {
            border-left: none;
            border-right: 5px solid var(--main-blue);
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 119, 182, 0.15);
        }

        .card-date {
            font-size: 0.9rem;
            color: var(--main-blue);
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.2rem;
            color: var(--dark-blue);
            margin-bottom: 0.5rem;
        }

        /* --- 12-Month Grid --- */
        #year-grid-section {
            transition: opacity 0.3s ease;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .month-block {
            background-color: var(--light-blue);
            border: 2px solid var(--baby-blue);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .month-block:hover {
            background-color: var(--main-blue);
            color: var(--white);
            border-color: var(--dark-blue);
            transform: scale(1.02);
        }

        .month-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .month-count {
            font-size: 0.9rem;
            background-color: var(--dark-blue);
            color: var(--baby-blue);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            display: inline-block;
        }

        /* --- Expanded Month View --- */
        #expanded-month-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        #expanded-month-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .expanded-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background-color: var(--dark-blue);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            color: var(--white);
        }

        .back-btn {
            background-color: var(--baby-blue);
            color: var(--dark-blue);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-btn:hover { background-color: var(--white); }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background-color: var(--baby-blue);
            border: 2px solid var(--main-blue);
            border-radius: 8px;
            overflow: hidden;
        }

        .day-header {
            background-color: var(--dark-blue);
            color: var(--white);
            text-align: center;
            padding: 0.75rem 0;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .day-cell {
            background-color: var(--white);
            min-height: 100px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .day-cell.empty { background-color: var(--light-blue); opacity: 0.5; }

        .day-number {
            font-weight: bold;
            color: var(--dark-blue);
            margin-bottom: 0.25rem;
        }

        .event-chip {
            background-color: var(--main-blue);
            color: var(--white);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-chip:hover { background-color: var(--dark-blue); }

        /* --- Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(10, 25, 47, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--white);
            padding: 2.5rem;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid var(--baby-blue);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-title {
            color: var(--dark-blue);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--light-blue);
            padding-bottom: 0.5rem;
        }

        .modal-detail {
            margin-bottom: 0.75rem;
            color: var(--main-blue);
            font-size: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .modal-detail strong { color: var(--dark-blue); min-width: 80px;}

        .modal-close {
            margin-top: 2rem;
            width: 100%;
            background-color: var(--main-blue);
            color: var(--white);
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .modal-close:hover { background-color: var(--dark-blue); }

        /* Responsive */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; text-align: center; }
            .brand-container { flex-direction: column; }
            h1 { font-size: 1.4rem; }
            .day-cell { min-height: 70px; padding: 0.2rem; }
            .event-chip { font-size: 0.65rem; padding: 0.15rem; }
            .day-header { font-size: 0.7rem; }
            .expanded-header { flex-direction: column; gap: 1rem; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="logo-placeholder">
                <img src="moe-logo.png" alt="MOE Logo" id="moeLogo">
            </div>
            <h1 id="pageTitle">School Sports Events in Bahrain</h1>
        </div>
        <button id="langToggle">عربي</button>
    </header>

    <main>
        <!-- Upcoming Events Showcase -->
        <section id="upcoming-showcase">
            <h2 class="section-title" id="upcomingTitle">Upcoming Events</h2>
            <div class="showcase-grid" id="upcomingCards">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- 12-Month Calendar Grid -->
        <section id="year-grid-section">
            <h2 class="section-title" id="yearTitle">Academic Year Calendar</h2>
            <div class="year-grid" id="yearGrid">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- Expanded Month View -->
        <section id="expanded-month-section">
            <div class="expanded-header">
                <h2 id="expandedMonthTitle">Month Year</h2>
                <button class="back-btn" id="backBtn">Back to Year View</button>
            </div>
            <div class="calendar" id="calendarGrid">
                <!-- Injected via JS -->
            </div>
        </section>
    </main>

    <!-- Event Modal -->
    <div class="modal-overlay" id="eventModal">
        <div class="modal-content">
            <h3 class="modal-title" id="mTitle">Event Title</h3>
            <div class="modal-detail"><strong id="lDate">Date:</strong> <span id="mDate"></span></div>
            <div class="modal-detail"><strong id="lTime">Time:</strong> <span id="mTime"></span></div>
            <div class="modal-detail"><strong id="lLoc">Location:</strong> <span id="mLoc"></span></div>
            <button class="modal-close" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        // <!-- GM&USER_EDITABLE_DATA_START -->
        const eventsData = [
            { id: 1, title_en: 'Sports Governance', title_ar: 'الحوكمة الرياضية', date: '2026-10-04', time: '09:00', location_en: 'Ministry Headquarters', location_ar: 'مقر الوزارة', status: 'upcoming', sport_category: 'Management' },
            { id: 2, title_en: 'Sports Selection', title_ar: 'الانتقاء الرياضي', date: '2026-10-11', time: '08:00', location_en: 'National Stadium', location_ar: 'الاستاد الوطني', status: 'upcoming', sport_category: 'Talent' },
            { id: 3, title_en: 'Start of Discovering Talents', title_ar: 'البدء باكتشاف المواهب الطلابية', date: '2026-10-15', time: '10:00', location_en: 'Various Schools', location_ar: 'مدارس مختلفة', status: 'upcoming', sport_category: 'Talent' },
            { id: 4, title_en: 'Educational Regions Cup', title_ar: 'كأس منتخبات المناطق التعليمية', date: '2026-10-25', time: '15:30', location_en: 'Isa Town Club', location_ar: 'نادي مدينة عيسى', status: 'upcoming', sport_category: 'Tournament' },
            { id: 5, title_en: 'University Partnership', title_ar: 'الشراكة الجامعية', date: '2026-11-01', time: '11:00', location_en: 'University of Bahrain', location_ar: 'جامعة البحرين', status: 'upcoming', sport_category: 'University' },
            { id: 6, title_en: 'University Games (Esports)', title_ar: 'الألعاب الجامعية (الإلكترونية)', date: '2026-11-15', time: '18:00', location_en: 'Esports Arena', location_ar: 'صالة الألعاب الإلكترونية', status: 'upcoming', sport_category: 'University' },
            { id: 7, title_en: 'Technical Conference', title_ar: 'المؤتمر الفني لدوري الجامعات', date: '2027-02-07', time: '09:30', location_en: 'Conference Hall', location_ar: 'قاعة المؤتمرات', status: 'upcoming', sport_category: 'Management' },
            { id: 8, title_en: 'Elite Sports Camps', title_ar: 'معسكرات النخبة الرياضية', date: '2027-03-14', time: '07:00', location_en: 'Training Center', location_ar: 'مركز التدريب', status: 'upcoming', sport_category: 'Talent' },
            { id: 9, title_en: 'University Games (Chess)', title_ar: 'الألعاب الجامعية (للشطرنج)', date: '2027-03-21', time: '16:00', location_en: 'Student Center', location_ar: 'مركز الطلبة', status: 'upcoming', sport_category: 'University' },
            { id: 10, title_en: 'University Games (Table Tennis)', title_ar: 'الألعاب الجامعية (كرة الطاولة)', date: '2027-04-04', time: '15:00', location_en: 'Sports Hall', location_ar: 'الصالة الرياضية', status: 'upcoming', sport_category: 'University' },
            { id: 11, title_en: 'University Games (Football)', title_ar: 'الألعاب الجامعية (كرة القدم)', date: '2027-04-11', time: '17:30', location_en: 'Main Field', location_ar: 'الملعب الرئيسي', status: 'upcoming', sport_category: 'University' },
            { id: 12, title_en: 'Gulf School Tournament', title_ar: 'البطولة الخليجية المدرسية', date: '2027-04-25', time: '08:00', location_en: 'National Complex', location_ar: 'المجمع الوطني', status: 'upcoming', sport_category: 'Tournament' },
            { id: 13, title_en: 'University Forums', title_ar: 'ملتقيات جامعية', date: '2027-05-09', time: '10:00', location_en: 'Auditorium', location_ar: 'المسرح', status: 'upcoming', sport_category: 'University' },
            { id: 14, title_en: 'Sports Excellence Award', title_ar: 'جائزة التميز الرياضي', date: '2027-05-16', time: '19:00', location_en: 'Royal Hall', location_ar: 'القاعة الملكية', status: 'upcoming', sport_category: 'Management' }
        ];
        // <!-- GM&USER_EDITABLE_DATA_END -->

        // State variables
        let currentLang = 'en';
        let expandedMonthData = null; // { year, month }

        // Define Academic Year: Sep 2026 to Aug 2027
        const academicYearMonths = [];
        for (let i = 0; i < 12; i++) {
            let d = new Date(2026, 8 + i, 1); // 8 = September
            academicYearMonths.push({ year: d.getFullYear(), month: d.getMonth() });
        }

        // I18n Dictionary
        const i18n = {
            en: {
                title: "School Sports Events in Bahrain",
                btnLang: "عربي",
                upcomingTitle: "Upcoming Events",
                yearTitle: "2026 - 2027 Academic Calendar",
                backBtn: "Back to Year View",
                lDate: "Date:",
                lTime: "Time:",
                lLoc: "Location:",
                btnClose: "Close",
                eventsCount: "Events",
                days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
                months: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
            },
            ar: {
                title: "فعاليات الرياضة المدرسية في البحرين",
                btnLang: "English",
                upcomingTitle: "الفعاليات القادمة",
                yearTitle: "التقويم الأكاديمي ٢٠٢٦ - ٢٠٢٧",
                backBtn: "العودة للتقويم السنوي",
                lDate: "التاريخ:",
                lTime: "الوقت:",
                lLoc: "المكان:",
                btnClose: "إغلاق",
                eventsCount: "فعاليات",
                days: ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"],
                months: ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"]
            }
        };

        // Utility: Convert numbers to Arabic numerals when in Arabic mode
        function translateNumbers(numStr) {
            if (currentLang === 'en') return numStr;
            const arabicNumbers = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return String(numStr).replace(/[0-9]/g, w => arabicNumbers[w]);
        }

        // Initialization
        function init() {
            setupEventListeners();
            updateLanguageUI();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'en' ? 'ltr' : 'rtl';
            updateLanguageUI();
        }

        function updateLanguageUI() {
            const t = i18n[currentLang];
            document.getElementById('pageTitle').textContent = t.title;
            document.getElementById('langToggle').textContent = t.btnLang;
            document.getElementById('upcomingTitle').textContent = t.upcomingTitle;
            document.getElementById('yearTitle').textContent = t.yearTitle;
            document.getElementById('backBtn').textContent = t.backBtn;
            document.getElementById('lDate').textContent = t.lDate;
            document.getElementById('lTime').textContent = t.lTime;
            document.getElementById('lLoc').textContent = t.lLoc;
            document.getElementById('closeModalBtn').textContent = t.btnClose;

            renderUpcoming();
            if (expandedMonthData) {
                renderExpandedMonth(expandedMonthData.year, expandedMonthData.month);
            } else {
                renderYearGrid();
            }
        }

        function renderUpcoming() {
            const container = document.getElementById('upcomingCards');
            container.innerHTML = '';
            
            // Sort by date and take the first 4 for the showcase
            const upcomingEvents = eventsData
                .filter(e => e.status === 'upcoming')
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .slice(0, 4);

            upcomingEvents.forEach(e => {
                const card = document.createElement('div');
                card.className = 'event-card';
                card.onclick = () => openModal(e);
                
                const title = currentLang === 'en' ? e.title_en : e.title_ar;
                const formattedDate = translateNumbers(e.date);

                card.innerHTML = `
                    <div class="card-date">${formattedDate}</div>
                    <div class="card-title">${title}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderYearGrid() {
            const container = document.getElementById('yearGrid');
            container.innerHTML = '';
            document.getElementById('year-grid-section').style.display = 'block';
            document.getElementById('expanded-month-section').classList.remove('active');
            expandedMonthData = null;

            const t = i18n[currentLang];

            academicYearMonths.forEach(m => {
                const block = document.createElement('div');
                block.className = 'month-block';
                
                // Count events for this month
                const monthEvents = eventsData.filter(e => {
                    const ed = new Date(e.date);
                    return ed.getFullYear() === m.year && ed.getMonth() === m.month;
                });

                const countStr = translateNumbers(monthEvents.length);
                const yearStr = translateNumbers(m.year);

                block.innerHTML = `
                    <div class="month-name">${t.months[m.month]} ${yearStr}</div>
                    <div class="month-count">${countStr} ${t.eventsCount}</div>
                `;
                
                block.onclick = () => {
                    document.getElementById('year-grid-section').style.display = 'none';
                    document.getElementById('expanded-month-section').classList.add('active');
                    expandedMonthData = { year: m.year, month: m.month };
                    renderExpandedMonth(m.year, m.month);
                };
                container.appendChild(block);
            });
        }

        function renderExpandedMonth(year, month) {
            const t = i18n[currentLang];
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const yearStr = translateNumbers(year);
            document.getElementById('expandedMonthTitle').textContent = `${t.months[month]} ${yearStr}`;

            // Render Days Header
            t.days.forEach(day => {
                const div = document.createElement('div');
                div.className = 'day-header';
                div.textContent = day;
                grid.appendChild(div);
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Empty cells before start of month
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                grid.appendChild(emptyCell);
            }

            // Days
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                const num = document.createElement('div');
                num.className = 'day-number';
                num.textContent = translateNumbers(day);
                cell.appendChild(num);

                const dateString = `${year}-${String(month+1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayEvents = eventsData.filter(e => e.date === dateString);

                dayEvents.forEach(e => {
                    const chip = document.createElement('div');
                    chip.className = 'event-chip';
                    chip.textContent = currentLang === 'en' ? e.title_en : e.title_ar;
                    chip.onclick = (event) => {
                        event.stopPropagation();
                        openModal(e);
                    };
                    cell.appendChild(chip);
                });

                grid.appendChild(cell);
            }
        }

        function openModal(eventData) {
            document.getElementById('mTitle').textContent = currentLang === 'en' ? eventData.title_en : eventData.title_ar;
            document.getElementById('mDate').textContent = translateNumbers(eventData.date);
            document.getElementById('mTime').textContent = translateNumbers(eventData.time);
            document.getElementById('mLoc').textContent = currentLang === 'en' ? eventData.location_en : eventData.location_ar;
            
            document.getElementById('eventModal').classList.add('active');
        }

        function setupEventListeners() {
            document.getElementById('langToggle').addEventListener('click', toggleLanguage);
            
            document.getElementById('backBtn').addEventListener('click', () => {
                renderYearGrid();
                // Scroll back to the year grid section
                document.getElementById('year-grid-section').scrollIntoView({ behavior: 'smooth' });
            });

            const modal = document.getElementById('eventModal');
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                modal.classList.remove('active');
            });
            
            modal.addEventListener('click', (e) => {
                if(e.target === modal) modal.classList.remove('active');
            });
        }

        // Boot
        init();
    </script>
</body>
</html>
