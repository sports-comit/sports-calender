<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bahrain School Sports Calendar</title>
    <style>
        /* --- GLOBAL NUMERIC FORCING (STRICT NUMBER RULE) --- */
        *, *::before, *::after, html[dir="rtl"] *, html[dir="ltr"] * {
            font-variant-numeric: lining-nums tabular-nums !important;
            font-feature-settings: "lnum" 1, "tnum" 1 !important;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Palette: Balanced tones of Blue, Dark Blue, and Baby Blue */
            --dark-blue-deep: #051329;
            --dark-blue-navy: #0B2545;
            --dark-blue-surface: #133E68;
            --blue-primary: #0077B6;
            --blue-accent: #0096C7;
            --baby-blue: #90E0EF;
            --baby-blue-light: #E0F7FA;
            --baby-blue-pale: #F4FAFD;
            --white: #FFFFFF;
            --border-subtle: rgba(0, 119, 182, 0.16);
            --modal-backdrop: rgba(5, 19, 41, 0.65);
        }

        body {
            background-color: var(--baby-blue-pale);
            color: var(--dark-blue-navy);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- Header: Fully Centered with Luminescent Glow --- */
        header {
            background: linear-gradient(135deg, var(--dark-blue-deep) 0%, var(--dark-blue-navy) 100%);
            padding: 2.2rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(5, 19, 41, 0.45);
            border-bottom: 2px solid var(--blue-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px; /* Generous structural vertical margin */
        }

        h1.site-title {
            color: var(--baby-blue);
            font-size: 2.1rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-align: center;
            width: 100%;
            padding: 0 5.5rem;
            /* Refined multi-layer glow */
            text-shadow: 0 0 12px rgba(144, 224, 239, 0.8),
                         0 0 24px rgba(0, 119, 182, 0.65),
                         0 0 45px rgba(0, 150, 199, 0.45);
            user-select: none;
        }

        #langToggle {
            position: absolute;
            inset-inline-end: 2rem;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--baby-blue);
            color: var(--dark-blue-deep);
            border: 2px solid transparent;
            padding: 0.55rem 1.4rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            flex-shrink: 0;
        }

        #langToggle:hover {
            background-color: var(--white);
            color: var(--blue-primary);
            border-color: var(--baby-blue);
            box-shadow: 0 0 14px rgba(144, 224, 239, 0.6);
        }

        /* --- Main Layout & Breathability --- */
        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem 3rem 1.5rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-subtle);
            padding-bottom: 0.6rem;
        }

        .section-title {
            color: var(--dark-blue-navy);
            font-size: 1.45rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* --- Section 1: Upcoming Events Showcase --- */
        #upcomingShowcase {
            margin-bottom: 40px; /* Generous structural vertical margin */
        }

        .showcase-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(265px, 1fr));
            gap: 1.25rem;
        }

        .showcase-card {
            background: var(--white);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.3rem;
            border-inline-start: 6px solid var(--blue-primary);
            box-shadow: 0 4px 14px rgba(5, 19, 41, 0.05);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .showcase-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0, 119, 182, 0.16);
            border-color: var(--blue-accent);
        }

        .card-tag-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .card-date-badge {
            font-size: 0.85rem;
            color: var(--blue-primary);
            font-weight: 700;
            background-color: var(--baby-blue-light);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
        }

        .card-category-badge {
            font-size: 0.75rem;
            background-color: var(--dark-blue-surface);
            color: var(--baby-blue);
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.1rem;
            color: var(--dark-blue-deep);
            font-weight: 700;
            margin-bottom: 0.6rem;
            line-height: 1.4;
        }

        .card-location-meta {
            font-size: 0.85rem;
            color: var(--dark-blue-surface);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.4rem;
        }

        /* --- Section 2: 12-Month Calendar Grid with Mini-Calendars --- */
        #yearGridSection {
            margin-bottom: 40px;
            transition: opacity 0.3s ease;
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .month-block-card {
            background-color: var(--white);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 1.3rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(5, 19, 41, 0.04);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .month-block-card:hover {
            border-color: var(--blue-primary);
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0, 119, 182, 0.16);
        }

        .month-card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.9rem;
            border-bottom: 1px solid var(--baby-blue-light);
            padding-bottom: 0.5rem;
        }

        .month-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--dark-blue-navy);
        }

        .month-event-counter {
            font-size: 0.78rem;
            background-color: var(--baby-blue-light);
            color: var(--blue-primary);
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-weight: 700;
        }

        /* Embedded Mini-Calendar Grid */
        .mini-calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            text-align: center;
            margin-top: 0.4rem;
        }

        .mini-day-header {
            font-size: 0.68rem;
            color: var(--dark-blue-surface);
            font-weight: 700;
            padding-bottom: 0.3rem;
        }

        .mini-day-cell {
            font-size: 0.75rem;
            padding: 0.25rem 0;
            border-radius: 4px;
            color: var(--dark-blue-navy);
            background-color: var(--white);
            position: relative;
        }

        .mini-day-cell.empty {
            visibility: hidden;
        }

        .mini-day-cell.has-event {
            background-color: var(--baby-blue);
            color: var(--dark-blue-deep);
            font-weight: 800;
            box-shadow: inset 0 0 0 1px var(--blue-accent);
        }

        /* --- Section 3: Full Expanded Month View --- */
        #expandedMonthSection {
            display: none;
            margin-bottom: 40px;
            animation: slideDownFade 0.35s ease forwards;
        }

        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .expanded-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--white);
            padding: 1rem 1.3rem;
            border-radius: 10px;
            margin-bottom: 1.3rem;
            border: 1px solid var(--border-subtle);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .back-nav-btn {
            background-color: var(--dark-blue-navy);
            color: var(--baby-blue);
            border: none;
            padding: 0.65rem 1.3rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-nav-btn:hover {
            background-color: var(--blue-primary);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.25);
        }

        .category-filters-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .category-filter-btn {
            background-color: var(--baby-blue-light);
            color: var(--dark-blue-deep);
            border: 1px solid var(--blue-accent);
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .category-filter-btn.active {
            background-color: var(--blue-primary);
            color: var(--white);
            border-color: var(--blue-primary);
        }

        .calendar-table-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            background-color: var(--blue-primary);
            border: 2px solid var(--blue-primary);
            border-radius: 12px;
            padding: 6px;
            overflow: hidden;
        }

        .calendar-day-header {
            background-color: var(--dark-blue-navy);
            color: var(--baby-blue);
            text-align: center;
            padding: 0.8rem 0;
            font-weight: 700;
            font-size: 0.9rem;
            border-radius: 6px;
        }

        .calendar-cell {
            background-color: var(--white);
            min-height: 110px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-radius: 6px;
        }

        .calendar-cell.cell-empty {
            background-color: rgba(244, 250, 253, 0.6);
            border: 1px dashed rgba(0, 119, 182, 0.2);
        }

        .cell-date-num {
            font-weight: 800;
            color: var(--dark-blue-deep);
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }

        .event-chip-item {
            background-color: var(--blue-primary);
            color: var(--white);
            padding: 0.35rem 0.5rem;
            border-radius: 4px;
            font-size: 0.78rem;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
            transition: background 0.2s ease;
        }

        .event-chip-item:hover {
            background-color: var(--dark-blue-navy);
        }

        /* --- Section 4: Polished School Standings Leaderboard --- */
        #leaderboardSection {
            margin-top: 10px;
            margin-bottom: 2rem;
        }

        .leaderboard-card {
            background-color: var(--white);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(5, 19, 41, 0.05);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            text-align: start;
        }

        .leaderboard-table th {
            background-color: var(--dark-blue-navy);
            color: var(--baby-blue);
            font-weight: 700;
            font-size: 0.9rem;
            padding: 1rem 1.2rem;
            text-align: inherit;
        }

        .leaderboard-table td {
            padding: 1rem 1.2rem;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--baby-blue-light);
            color: var(--dark-blue-deep);
            text-align: inherit;
        }

        .leaderboard-table tbody tr:hover {
            background-color: var(--baby-blue-pale);
        }

        .rank-badge {
            font-weight: 800;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: var(--baby-blue-light);
            color: var(--blue-primary);
        }

        .rank-top-1 { background-color: #FFD166; color: #5C4300; }
        .rank-top-2 { background-color: #E0E1DD; color: #333333; }
        .rank-top-3 { background-color: #EDAFB8; color: #5E2A32; }

        .pts-col {
            font-weight: 800;
            color: var(--blue-primary);
        }

        /* --- Interactive Modal with Backdrop Blur --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--modal-backdrop);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: var(--white);
            padding: 2.25rem;
            border-radius: 14px;
            width: 90%;
            max-width: 440px;
            box-shadow: 0 16px 36px rgba(5, 19, 41, 0.4);
            border: 3px solid var(--baby-blue);
            transform: scale(0.95);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-title {
            color: var(--dark-blue-deep);
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
            border-bottom: 2px solid var(--baby-blue-light);
            padding-bottom: 0.65rem;
        }

        .modal-meta-field {
            margin-bottom: 0.85rem;
            color: var(--dark-blue-surface);
            font-size: 1rem;
            display: flex;
            gap: 0.5rem;
            align-items: baseline;
        }

        .modal-meta-field strong {
            color: var(--dark-blue-navy);
            min-width: 85px;
            font-weight: 700;
        }

        .modal-meta-val {
            color: var(--dark-blue-deep);
            word-break: break-word;
        }

        .modal-close-btn {
            margin-top: 1.75rem;
            width: 100%;
            background-color: var(--blue-primary);
            color: var(--white);
            border: none;
            padding: 0.85rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .modal-close-btn:hover {
            background-color: var(--dark-blue-navy);
        }

        /* --- Responsive Queries --- */
        @media (max-width: 768px) {
            header {
                padding: 1.5rem 1rem;
                flex-direction: column;
                gap: 1rem;
            }
            h1.site-title {
                font-size: 1.4rem;
                padding: 0;
            }
            #langToggle {
                position: static;
                transform: none;
            }
            main {
                padding: 0 0.8rem 2rem 0.8rem;
            }
            .calendar-cell {
                min-height: 80px;
                padding: 0.3rem;
            }
            .calendar-day-header {
                font-size: 0.75rem;
                padding: 0.5rem 0;
            }
            .event-chip-item {
                font-size: 0.68rem;
                padding: 0.2rem;
            }
            .expanded-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .leaderboard-table th, .leaderboard-table td {
                padding: 0.75rem 0.6rem;
                font-size: 0.85rem;
            }
        }
    </style>
</head>

    </main>

            { id: 10, title_en: 'Collegiate Table Tennis Finals', title_ar: 'البطولة الجامعية لكرة الطاولة', date: '2027-04-04', time: '15:00', location_en: 'Table Tennis Association Hall', location_ar: 'صالة اتحاد كرة الطاولة', sport_category: 'University' },
            { id: 11, title_en: 'Collegiate Football Championship', title_ar: 'البطولة الجامعية لكرة القدم', date: '2027-04-11', time: '17:30', location_en: 'BFA Stadium, Riffa', location_ar: 'استاد اتحاد كرة القدم، الرفاع', sport_category: 'University' },
            { id: 12, title_en: 'Gulf School Sports Championship', title_ar: 'البطولة الخليجية المدرسية', date: '2027-04-25', time: '08:30', location_en: 'Khalifa Sports City, Isa Town', location_ar: 'مدينة خليفة الرياضية', sport_category: 'Tournament' },
            { id: 13, title_en: 'Talent Discovery Season Closing', title_ar: 'نهاية اكتشاف المواهب الطلابية', date: '2027-04-29', time: '11:00', location_en: 'Hall D, Ministry Complex', location_ar: 'القاعة د، مجمع الوزارة', sport_category: 'Talent' },
            { id: 14, title_en: 'Collegiate Sports Development Forum', title_ar: 'ملتقى تطوير الرياضة الجامعية', date: '2027-05-09', time: '10:00', location_en: 'Main Auditorium, Sakhir', location_ar: 'المسرح الرئيسي، الصخير', sport_category: 'University' },
            { id: 15, title_en: 'Annual Sports Excellence Awards', title_ar: 'جائزة التميز الرياضي', date: '2027-05-16', time: '19:00', location_en: 'Cultural Hall, Manama', location_ar: 'الصالة الثقافية، المنامة', sport_category: 'Management' }
        ];

        const sampleLeaderboard = [
            { rank: 1, name_en: 'Isa Town Secondary School', name_ar: 'مدرسة مدينة عيسى الثانوية', played: 12, wins: 10, points: 31 },
            { rank: 2, name_en: 'Al-Hidaya Al-Khalifia School', name_ar: 'مدرسة الهداية الخليفية', played: 12, wins: 9, points: 28 },
            { rank: 3, name_en: 'Muharraq Secondary School', name_ar: 'مدرسة المحرق الثانوية', played: 12, wins: 8, points: 25 },
            { rank: 4, name_en: 'Riffa Secondary School', name_ar: 'مدرسة الرفاع الثانوية', played: 12, wins: 7, points: 22 },
            { rank: 5, name_en: 'Shaikh Isa bin Ali School', name_ar: 'مدرسة الشيخ عيسى بن علي', played: 12, wins: 5, points: 17 }
        ];
        // <!-- GM&USER_EDITABLE_DATA_END -->

        // State Machine
        let currentLang = 'en';
        let expandedMonthMeta = null;
        let selectedCategory = 'All';

        // 12-Month Academic Year (Sep 2026 - Aug 2027)
        const academicMonths = Array.from({ length: 12 }, (_, idx) => {
            const dateRef = new Date(2026, 8 + idx, 1);
            return {
                year: dateRef.getFullYear(),
                month: dateRef.getMonth()
            };
        });

        // Multilingual Translation Dictionary
        const i18n = {
            en: {
                siteTitle: "School Sports Events in Bahrain",
                btnLang: "عربي",
                upcomingTitle: "Upcoming Events Showcase",
                yearGridTitle: "Academic Calendar (12 Months)",
                backBtn: "Back to Year View",
                backArrow: "←",
                lblDate: "Date:",
                lblTime: "Time:",
                lblLoc: "Location:",
                btnClose: "Close",
                eventsCountSuffix: "Events",
                allCategories: "All Sports",
                daysOfWeek: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
                miniDays: ["S", "M", "T", "W", "T", "F", "S"],
                monthsOfYear: [
                    "January", "February", "March", "April", "May", "June",
                    "July", "August", "September", "October", "November", "December"
                ],
                leaderboardTitle: "School Standings Leaderboard",
                thRank: "Rank",
                thSchool: "School Name",
                thPlayed: "Played",
                thWins: "Wins",
                thPoints: "Points"
            },
            ar: {
                siteTitle: "فعاليات الرياضة المدرسية في البحرين",
                btnLang: "English",
                upcomingTitle: "أبرز الفعاليات القادمة",
                yearGridTitle: "التقويم الدراسي السنوي (12 شهراً)",
                backBtn: "العودة للتقويم السنوي",
                backArrow: "→",
                lblDate: "التاريخ:",
                lblTime: "الوقت:",
                lblLoc: "المكان:",
                btnClose: "إغلاق",
                eventsCountSuffix: "فعاليات",
                allCategories: "جميع الرياضات",
                daysOfWeek: ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"],
                miniDays: ["أ", "إ", "ث", "أ", "خ", "ج", "س"],
                monthsOfYear: [
                    "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
                    "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
                ],
                leaderboardTitle: "جدول ترتيب المدارس المعتمد",
                thRank: "الترتيب",
                thSchool: "اسم المدرسة",
                thPlayed: "لعب",
                thWins: "فوز",
                thPoints: "النقاط"
            }
        };

        function formatNumberString(str) {
            return String(str);
        }

        function initializeApp() {
            bindEventListeners();
            updateUIStrings();
            renderLeaderboard();
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'ar' : 'en';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = (currentLang === 'en') ? 'ltr' : 'rtl';
            updateUIStrings();
        }

        function updateUIStrings() {
            const dict = i18n[currentLang];
            document.getElementById('pageTitle').textContent = dict.siteTitle;
            document.getElementById('langToggle').textContent = dict.btnLang;
            document.getElementById('upcomingHeaderTitle').textContent = dict.upcomingTitle;
            document.getElementById('yearHeaderTitle').textContent = dict.yearGridTitle;
            document.getElementById('backBtnLabel').textContent = dict.backBtn;
            document.getElementById('backArrowIcon').textContent = dict.backArrow;
            document.getElementById('lblDate').textContent = dict.lblDate;
            document.getElementById('lblTime').textContent = dict.lblTime;
            document.getElementById('lblLoc').textContent = dict.lblLoc;
            document.getElementById('modalCloseBtn').textContent = dict.btnClose;

            // Leaderboard Headers
            document.getElementById('leaderboardTitle').textContent = dict.leaderboardTitle;
            document.getElementById('thRank').textContent = dict.thRank;
            document.getElementById('thSchool').textContent = dict.thSchool;
            document.getElementById('thPlayed').textContent = dict.thPlayed;
            document.getElementById('thWins').textContent = dict.thWins;
            document.getElementById('thPoints').textContent = dict.thPoints;

            renderUpcomingShowcase();
            renderLeaderboard();

            if (expandedMonthMeta) {
                renderCategoryFilters();
                renderExpandedCalendar(expandedMonthMeta.year, expandedMonthMeta.month);
            } else {
                renderYearGrid();
            }
        }

        // Showcase: Immediate Future Events
        function renderUpcomingShowcase() {
            const container = document.getElementById('upcomingContainer');
            container.innerHTML = '';

            const nowIso = new Date().toISOString().split('T')[0];
            const upcomingList = eventsData
                .filter(ev => ev.date >= nowIso)
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .slice(0, 4);

            const displayList = upcomingList.length > 0 ? upcomingList : eventsData.slice(0, 4);

            displayList.forEach(eventItem => {
                const card = document.createElement('div');
                card.className = 'showcase-card';
                card.addEventListener('click', () => openModal(eventItem));

                const titleText = (currentLang === 'en') ? eventItem.title_en : eventItem.title_ar;
                const locText = (currentLang === 'en') ? eventItem.location_en : eventItem.location_ar;

                card.innerHTML = `
                    <div>
                        <div class="card-tag-row">
                            <span class="card-date-badge">${formatNumberString(eventItem.date)}</span>
                            <span class="card-category-badge">${eventItem.sport_category}</span>
                        </div>
                        <div class="card-title">${titleText}</div>
                    </div>
                    <div class="card-location-meta">
                        <span>📍</span>
                        <span>${locText}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 12-Month Calendar Grid with Mini-Calendars
        function renderYearGrid() {
            const container = document.getElementById('yearGridContainer');
            container.innerHTML = '';
            document.getElementById('yearGridSection').style.display = 'block';
            document.getElementById('expandedMonthSection').style.display = 'none';
            expandedMonthMeta = null;

            const dict = i18n[currentLang];

            academicMonths.forEach(m => {
                const block = document.createElement('div');
                block.className = 'month-block-card';

                const monthEvents = eventsData.filter(ev => {
                    const d = new Date(ev.date);
                    return d.getFullYear() === m.year && d.getMonth() === m.month;
                });

                const eventDaysSet = new Set(monthEvents.map(ev => parseInt(ev.date.split('-')[2], 10)));

                // Header
                const headerHtml = `
                    <div class="month-card-header">
                        <div class="month-title">${dict.monthsOfYear[m.month]} ${formatNumberString(m.year)}</div>
                        <div class="month-event-counter">${formatNumberString(monthEvents.length)} ${dict.eventsCountSuffix}</div>
                    </div>
                `;

                // Build Mini-Calendar Grid
                let miniCalHtml = `<div class="mini-calendar">`;
                dict.miniDays.forEach(dayLetter => {
                    miniCalHtml += `<div class="mini-day-header">${dayLetter}</div>`;
                });

                const firstDay = new Date(m.year, m.month, 1).getDay();
                const totalDays = new Date(m.year, m.month + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) {
                    miniCalHtml += `<div class="mini-day-cell empty"></div>`;
                }

                for (let day = 1; day <= totalDays; day++) {
                    const isEventDay = eventDaysSet.has(day);
                    miniCalHtml += `<div class="mini-day-cell ${isEventDay ? 'has-event' : ''}">${formatNumberString(day)}</div>`;
                }

                miniCalHtml += `</div>`;

                block.innerHTML = headerHtml + miniCalHtml;

                // Click to expand
                block.addEventListener('click', () => {
                    document.getElementById('yearGridSection').style.display = 'none';
                    document.getElementById('expandedMonthSection').style.display = 'block';
                    expandedMonthMeta = { year: m.year, month: m.month };
                    selectedCategory = 'All';
                    renderCategoryFilters();
                    renderExpandedCalendar(m.year, m.month);
                    document.getElementById('expandedMonthSection').scrollIntoView({ behavior: 'smooth' });
                });

                container.appendChild(block);
            });
        }

        // Category Filter Controls
        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilters');
            container.innerHTML = '';
            const dict = i18n[currentLang];

            const categories = ['All', ...new Set(eventsData.map(ev => ev.sport_category))];

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-filter-btn ${selectedCategory === cat ? 'active' : ''}`;
                btn.textContent = (cat === 'All') ? dict.allCategories : cat;
                btn.addEventListener('click', () => {
                    selectedCategory = cat;
                    renderCategoryFilters();
                    renderExpandedCalendar(expandedMonthMeta.year, expandedMonthMeta.month);
                });
                container.appendChild(btn);
            });
        }

        // Expanded Interactive Calendar Grid
        function renderExpandedCalendar(year, month) {
            const dict = i18n[currentLang];
            const grid = document.getElementById('calendarTableGrid');
            grid.innerHTML = '';

            document.getElementById('expandedMonthTitle').textContent =
                `${dict.monthsOfYear[month]} ${formatNumberString(year)}`;

            dict.daysOfWeek.forEach(dayName => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'calendar-day-header';
                dayHeader.textContent = dayName;
                grid.appendChild(dayHeader);
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDaysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'calendar-cell cell-empty';
                grid.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDaysInMonth; day++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell';

                const cellDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

                const numLabel = document.createElement('div');
                numLabel.className = 'cell-date-num';
                numLabel.textContent = formatNumberString(day);
                cell.appendChild(numLabel);

                const activeEvents = eventsData.filter(ev => {
                    return ev.date === cellDateStr && (selectedCategory === 'All' || ev.sport_category === selectedCategory);
                });

                activeEvents.forEach(evItem => {
                    const chip = document.createElement('div');
                    chip.className = 'event-chip-item';
                    chip.textContent = (currentLang === 'en') ? evItem.title_en : evItem.title_ar;
                    chip.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openModal(evItem);
                    });
                    cell.appendChild(chip);
                });

                grid.appendChild(cell);
            }
        }

        // Render Leaderboard
        function renderLeaderboard() {
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '';

            sampleLeaderboard.forEach(row => {
                const tr = document.createElement('tr');
                const rankClass = row.rank <= 3 ? `rank-top-${row.rank}` : '';
                const schoolName = currentLang === 'en' ? row.name_en : row.name_ar;

                tr.innerHTML = `
                    <td><span class="rank-badge ${rankClass}">${formatNumberString(row.rank)}</span></td>
                    <td style="font-weight: 600;">${schoolName}</td>
                    <td>${formatNumberString(row.played)}</td>
                    <td>${formatNumberString(row.wins)}</td>
                    <td class="pts-col">${formatNumberString(row.points)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Modal Handlers
        function openModal(eventItem) {
            document.getElementById('mTitle').textContent = (currentLang === 'en') ? eventItem.title_en : eventItem.title_ar;
            document.getElementById('mDate').textContent = formatNumberString(eventItem.date);
            document.getElementById('mTime').textContent = formatNumberString(eventItem.time);
            document.getElementById('mLoc').textContent = (currentLang === 'en') ? eventItem.location_en : eventItem.location_ar;

            document.getElementById('eventModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }

        function bindEventListeners() {
            document.getElementById('langToggle').addEventListener('click', toggleLanguage);

            // Universal Prominent Back Button Logic
            document.getElementById('backToYearBtn').addEventListener('click', () => {
                renderYearGrid();
                document.getElementById('yearGridSection').scrollIntoView({ behavior: 'smooth' });
            });

            document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

            const modalOverlay = document.getElementById('eventModal');
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });
        }

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
